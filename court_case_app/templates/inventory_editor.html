<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Внутренняя опись — редактор</title>
<style>
  body { font: 13px/1.4 "Segoe UI", Arial, sans-serif; margin: 12px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .toolbar { margin-bottom: 8px; display: flex; gap: 8px;
             align-items: center; flex-wrap: wrap; }
  .toolbar button { padding: 4px 10px; }
  #status { color: #080; margin-left: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bbb; padding: 2px 6px; vertical-align: top; }
  th { background: #f0f0f0; font-weight: normal; font-size: 12px;
       text-align: center; }
  td[contenteditable] { background: #fffce8; }
  td:nth-child(1), td:nth-child(2), td:nth-child(5), td:nth-child(6),
  td:nth-child(7), td:nth-child(8), td:nth-child(9), td:nth-child(10) {
    text-align: center; white-space: nowrap;
  }
  td:last-child { white-space: nowrap; }
  td:last-child button { padding: 0 5px; margin: 0 1px; cursor: pointer; }
</style>
</head>
<body data-inventory-id="{{ inventory_id }}">
<h1>Внутренняя опись — редактор (inventory_id={{ inventory_id }})</h1>
<div class="toolbar">
  <button id="btn-add-case" type="button">+ Дело</button>
  <button id="btn-generate" type="button">Из БД</button>
  <button id="btn-import" type="button">Импорт .xlsx</button>
  <button id="btn-export" type="button">Экспорт .xlsx</button>
  <span id="status"></span>
  <input type="file" id="file-import" accept=".xlsx" hidden>
  <input type="file" id="file-template" accept=".xlsx" hidden>
</div>
<table id="tbl">
  <thead>
    <tr>
      <th>A<br>том</th>
      <th>B<br>№ п/п</th>
      <th>Наименование</th>
      <th>Префикс</th>
      <th>E<br>увел.</th>
      <th>№ дела</th>
      <th>Год</th>
      <th>Кол-во<br>стр.</th>
      <th>I<br>нач.</th>
      <th>J<br>кон.</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<script src="{{ url_for('static', filename='js/inventory_editor.js') }}"></script>
</body>
</html>
